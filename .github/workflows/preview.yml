name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Validate required secrets
        run: |
          : "${VERCEL_TOKEN:?Secret VERCEL_TOKEN is not set. Add it in Settings → Secrets and variables → Actions.}"
          : "${VERCEL_ORG_ID:?Secret VERCEL_ORG_ID is not set. Run 'vercel link' locally and copy from .vercel/project.json}"
          : "${VERCEL_PROJECT_ID:?Secret VERCEL_PROJECT_ID is not set. Run 'vercel link' locally and copy from .vercel/project.json}"
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel environment information
        run: npx vercel@68.0.0 pull --yes --environment=preview

      - name: Build project artifacts
        run: npx vercel@68.0.0 build

      - name: Deploy to Vercel preview
        id: deploy
        run: |
          PREVIEW_URL=$(npx vercel@68.0.0 deploy --prebuilt)
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT

      - name: Comment PR with preview URL
        if: steps.deploy.outputs.preview_url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview deployed!**\n\n[Open preview →](${previewUrl})`
            });
